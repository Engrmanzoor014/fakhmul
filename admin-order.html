<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAKHMUL Admin — Orders</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #c0810d;
      --gold-light: #efd190;
      --gold-dark: #8B6520;
      --forest: #074807;
      --forest-mid: #0a5c0a;
      --forest-light: #084f08;
      --forest-pale: #E8F0E8;
      --cream: #FAF6F0;
      --warm-white: #FFFDF9;
      --sidebar-bg: #051f05;
      --sidebar-active: #0a3a0a;
      --text-dark: #1A1A0F;
      --text-mid: #4A4A3A;
      --text-light: #888870;
      --border: rgba(200, 151, 58, 0.18);
      --error: #c0392b;
      --success: #27ae60;
      --warning: #e67e22;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 240px; flex-shrink: 0; background: var(--sidebar-bg); color: white;
      display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100;
      border-right: 1px solid rgba(192,129,13,0.12);
    }

    .sidebar-logo {
      padding: 1.5rem 1.25rem; border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center; gap: 10px;
    }
    .logo-mark {
      width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--forest-mid), var(--gold-dark)); color: white;
      font-family: 'Playfair Display', serif; font-size: 0.9rem; font-weight: 700;
    }
    .logo-name {
      font-family: 'Playfair Display', serif; color: white; font-size: 1rem; font-weight: 700;
    }
    .logo-sub {
      font-size: 0.62rem; color: var(--gold-light); letter-spacing: 2px; text-transform: uppercase;
    }

    .sidebar-section { padding: 1.25rem 0.75rem 0.5rem; }
    .sidebar-section-label {
      font-size: 0.62rem; color: rgba(255,255,255,0.3); letter-spacing: 2px; text-transform: uppercase;
      padding: 0 0.5rem; margin-bottom: 0.4rem;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px;
      text-decoration: none; margin-bottom: 2px; color: rgba(255,255,255,0.75);
    }
    .nav-item:hover { background: rgba(255,255,255,0.06); }
    .nav-item.active {
      background: var(--sidebar-active); border-left: 2px solid var(--gold); padding-left: 10px; color: white;
    }
    .nav-icon { font-size: 1rem; width: 20px; text-align: center; flex-shrink: 0; }
    .nav-label { font-size: 0.85rem; font-weight: 500; }
    .nav-badge {
      margin-left: auto; background: var(--gold); color: white; font-size: 0.65rem; font-weight: 700;
      padding: 2px 7px; border-radius: 50px;
    }

    .sidebar-bottom { margin-top: auto; padding: 1rem 0.75rem; border-top: 1px solid rgba(255,255,255,0.06); }
    .logout-btn {
      display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; cursor: pointer;
      width: 100%; background: none; border: none; color: rgba(255,255,255,0.75); font-family: 'DM Sans', sans-serif;
    }
    .logout-btn:hover { background: rgba(192, 57, 43, 0.15); }

    .main { margin-left: 240px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
    .topbar {
      background: var(--warm-white); border-bottom: 1px solid var(--border); padding: 0 2rem; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .page-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--forest); }
    .page-breadcrumb { font-size: 0.78rem; color: var(--text-light); }
    .topbar-right { display: flex; align-items: center; gap: 1rem; }
    .view-store-btn {
      display: inline-flex; align-items: center; gap: 6px; background: var(--forest-pale); color: var(--forest);
      border: 1px solid var(--forest-pale); border-radius: 8px; padding: 7px 14px; font-size: 0.82rem;
      font-weight: 600; text-decoration: none; cursor: pointer;
    }
    .view-store-btn:hover { background: var(--forest); color: white; }
    .admin-avatar {
      width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--forest), var(--gold-dark)); color: white; font-size: 0.8rem; font-weight: 700;
    }

    .content { padding: 2rem; flex: 1; }
    .danger-banner {
      display: none; padding: 12px 16px; background: #fff3f1; color: var(--error); border: 1px solid #f4c4be;
      border-radius: 10px; margin-bottom: 1rem; font-size: 0.85rem;
    }
    .danger-banner.show { display: block; }

    .stats-row {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.5rem;
    }
    .stat-card {
      background: white; border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.25rem;
      display: flex; align-items: center; gap: 1rem;
    }
    .stat-icon {
      width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; flex-shrink: 0;
    }
    .stat-icon.orange { background: #fff1dc; }
    .stat-icon.blue { background: #eaf2ff; }
    .stat-icon.green { background: #eaf7ee; }
    .stat-icon.purple { background: #f4ecff; }
    .stat-num {
      font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; color: var(--forest);
    }
    .stat-label { font-size: 0.78rem; color: var(--text-light); }

    .table-wrap {
      background: white; border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    }
    .results-info {
      padding: 0.8rem 1.1rem; font-size: 0.82rem; color: var(--text-light); border-bottom: 1px solid var(--border);
      background: var(--cream); display: flex; align-items: center; justify-content: space-between;
    }
    table { width: 100%; border-collapse: collapse; }
    thead { background: var(--forest); }
    thead th {
      padding: 12px 16px; text-align: left; font-size: 0.72rem; font-weight: 600; color: rgba(255,255,255,0.8);
      text-transform: uppercase; letter-spacing: 1px;
    }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:hover { background: #f8faf8; }
    td { padding: 12px 16px; font-size: 0.88rem; }
    .pill {
      display: inline-block; border-radius: 50px; padding: 5px 10px; font-size: 0.68rem; font-weight: 700;
      letter-spacing: 0.5px;
    }
    .pill.pending { background: #fff1dc; color: var(--warning); }
    .pill.confirmed { background: #dfeeff; color: #2d6cdf; }
    .pill.shipped { background: #ecf9f2; color: var(--success); }
    .pill.cancelled { background: #fdeaea; color: var(--error); }

    @media (max-width: 900px) {
      body { display: block; }
      .sidebar { position: static; width: 100%; }
      .main { margin-left: 0; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">F</div>
      <div class="logo-text">
        <div class="logo-name">FAKHMUL</div>
        <div class="logo-sub">Admin</div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">Overview</div>
      <a class="nav-item" href="admin-dashboard.html"><span class="nav-icon">📦</span><span class="nav-label">Products</span></a>
      <a class="nav-item active" href="admin-order.html"><span class="nav-icon">🧾</span><span class="nav-label">Orders</span><span class="nav-badge">8</span></a>
      <a class="nav-item" href="admin-analytics.html"><span class="nav-icon">📈</span><span class="nav-label">Analytics</span></a>
    </div>

    <div class="sidebar-bottom">
      <button class="logout-btn" id="logoutBtn" type="button"><span>⎋</span><span>Logout</span></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <div class="page-title">Order Management</div>
        <div class="page-breadcrumb">Admin / Orders</div>
      </div>
      <div class="topbar-right">
        <a class="view-store-btn" href="index.html">View store</a>
        <div class="admin-avatar" id="adminAvatar">A</div>
      </div>
    </header>

    <div class="content">
      <div class="danger-banner" id="authBanner">Session expired or not authorized. Redirecting to the admin login page…</div>

      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-icon orange">🧾</div>
          <div>
            <div class="stat-num" id="totalOrders">0</div>
            <div class="stat-label">Total orders</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon blue">📦</div>
          <div>
            <div class="stat-num" id="pendingOrders">0</div>
            <div class="stat-label">Pending</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">✅</div>
          <div>
            <div class="stat-num" id="deliveredOrders">0</div>
            <div class="stat-label">Delivered</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon purple">💰</div>
          <div>
            <div class="stat-num" id="orderRevenue">$0</div>
            <div class="stat-label">Revenue</div>
          </div>
        </div>
      </div>

      <div class="table-wrap">
        <div class="results-info">
          <span>Recent orders</span>
          <span id="updatedAt">Updated just now</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>Order</th>
              <th>Customer</th>
              <th>Items</th>
              <th>Total</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const orders = [
      { id: 'ORD-1042', customer: 'Ayesha Khan', items: 3, total: 2680, status: 'pending' },
      { id: 'ORD-1043', customer: 'Nabeel Raza', items: 2, total: 1850, status: 'confirmed' },
      { id: 'ORD-1044', customer: 'Hina Ahmed', items: 4, total: 4150, status: 'shipped' },
      { id: 'ORD-1045', customer: 'Irfan Ali', items: 1, total: 950, status: 'cancelled' },
      { id: 'ORD-1046', customer: 'Sana Bibi', items: 2, total: 1690, status: 'delivered' }
    ];

    async function ensureAdminSession() {
      try {
        const response = await fetch('/api/v1/auth/me', { credentials: 'same-origin' });
        if (!response.ok) throw new Error('Unauthorized');
        const data = await response.json();
        if (!data.user || data.user.role !== 'ADMIN') throw new Error('Forbidden');
        document.getElementById('adminAvatar').textContent = (data.user.email || 'A').charAt(0).toUpperCase();
        return true;
      } catch (error) {
        document.getElementById('authBanner').classList.add('show');
        setTimeout(() => {
          window.location.href = 'admin-login.html';
        }, 1400);
        return false;
      }
    }

    async function logoutAdmin() {
      try {
        await fetch('/api/v1/auth/logout', {
          method: 'POST',
          credentials: 'same-origin'
        });
      } catch (error) {
        // ignore
      } finally {
        window.location.href = 'admin-login.html';
      }
    }

    function renderOrders() {
      const rows = orders.map(order => {
        const statusClass = order.status === 'pending' ? 'pending' : order.status === 'confirmed' ? 'confirmed' : order.status === 'shipped' ? 'shipped' : order.status === 'cancelled' ? 'cancelled' : 'shipped';
        return `
          <tr>
            <td><strong>${order.id}</strong></td>
            <td>${order.customer}</td>
            <td>${order.items}</td>
            <td>PKR ${order.total}</td>
            <td><span class="pill ${statusClass}">${order.status}</span></td>
          </tr>
        `;
      }).join('');

      document.getElementById('ordersBody').innerHTML = rows;
      document.getElementById('totalOrders').textContent = orders.length;
      document.getElementById('pendingOrders').textContent = orders.filter(o => o.status === 'pending').length;
      document.getElementById('deliveredOrders').textContent = orders.filter(o => o.status === 'delivered').length;
      document.getElementById('orderRevenue').textContent = '$' + (orders.reduce((sum, o) => sum + o.total, 0) / 1000).toFixed(1) + 'K';
      document.getElementById('updatedAt').textContent = 'Updated just now';
    }

    document.getElementById('logoutBtn').addEventListener('click', logoutAdmin);

    (async function init() {
      const ok = await ensureAdminSession();
      if (!ok) return;
      renderOrders();
    })();
  </script>
</body>
</html>
